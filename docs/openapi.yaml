openapi: 3.1.0
info:
  title: 'Capell Public Page API'
  version: v1
  summary: 'Supported v1 headless content API, with scoped preview and signed revalidation webhooks.'
  description: 'Public, read-only page resolution for headless consumers. Returned HTML is sanitized and authoring surfaces are forbidden.'
servers:
  - url: 'https://{host}'
    variables:
      host:
        default: example.com
paths:
  /api/capell/v1/pages/resolve:
    get:
      operationId: resolvePublicPageV1
      summary: 'Resolve a published Capell page by URL.'
      description: 'Compatibility endpoint; migrate new clients to /api/v1/pages/resolve. No removal date is set.'
      tags:
        - 'Public Pages'
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Containers'
      responses:
        200:
          $ref: '#/components/responses/PageResolved'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          $ref: '#/components/responses/InvalidLayoutHtmlRequest'
      deprecated: true
  /api/capell/pages/resolve:
    get:
      operationId: resolvePublicPageLegacy
      summary: 'Resolve a published Capell page by URL through the legacy compatibility path.'
      description: 'Compatibility endpoint; migrate new clients to /api/v1/pages/resolve. No removal date is set.'
      tags:
        - 'Public Pages'
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Containers'
      responses:
        200:
          $ref: '#/components/responses/PageResolved'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          $ref: '#/components/responses/InvalidLayoutHtmlRequest'
      deprecated: true
  /api/v1/pages:
    get:
      operationId: headlessV1Pages
      summary: 'Supported v1 pages'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: 'filter[type]'
          in: query
          schema:
            type: string
            maxLength: 100
        - name: 'filter[path]'
          in: query
          schema:
            type: string
            maxLength: 1024
      responses:
        200:
          description: 'Safe content representation.'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, no-cache; preview and bearer requests private, no-store.'
            Surrogate-Key:
              schema:
                type: string
              description: 'html-cache site-{id} purge key. Sent only when capell-api.expose_surrogate_key_header (CAPELL_API_EXPOSE_SURROGATE_KEY) is true.'
            Cache-Tag:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentPage'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type:
                          - string
                          - 'null'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          description: 'Invalid query or expired/context-mismatched cursor.'
        429:
          description: 'Rate limit exceeded.'
        503:
          description: 'Eligibility unavailable; retry later.'
  /api/v1/pages/resolve:
    get:
      operationId: headlessV1Resolve
      summary: 'Supported v1 resolve'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
      responses:
        200:
          description: 'Safe content representation.'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, no-cache; preview and bearer requests private, no-store.'
            Surrogate-Key:
              schema:
                type: string
              description: 'html-cache site-{id} purge key. Sent only when capell-api.expose_surrogate_key_header (CAPELL_API_EXPOSE_SURROGATE_KEY) is true.'
            Cache-Tag:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ContentPage'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          description: 'Invalid query or expired/context-mismatched cursor.'
        429:
          description: 'Rate limit exceeded.'
        503:
          description: 'Eligibility unavailable; retry later.'
  '/api/v1/collections/{type}':
    get:
      operationId: headlessV1Collections
      summary: 'Supported v1 collections'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: 'filter[type]'
          in: query
          schema:
            type: string
            maxLength: 100
        - name: 'filter[path]'
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Safe content representation.'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, no-cache; preview and bearer requests private, no-store.'
            Surrogate-Key:
              schema:
                type: string
              description: 'html-cache site-{id} purge key. Sent only when capell-api.expose_surrogate_key_header (CAPELL_API_EXPOSE_SURROGATE_KEY) is true.'
            Cache-Tag:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentPage'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type:
                          - string
                          - 'null'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          description: 'Invalid query or expired/context-mismatched cursor.'
        429:
          description: 'Rate limit exceeded.'
        503:
          description: 'Eligibility unavailable; retry later.'
  /api/v1/search:
    get:
      operationId: headlessV1Search
      summary: 'Supported v1 search'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: 'filter[type]'
          in: query
          schema:
            type: string
            maxLength: 100
        - name: 'filter[path]'
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        200:
          description: 'Safe content representation.'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, no-cache; preview and bearer requests private, no-store.'
            Surrogate-Key:
              schema:
                type: string
              description: 'html-cache site-{id} purge key. Sent only when capell-api.expose_surrogate_key_header (CAPELL_API_EXPOSE_SURROGATE_KEY) is true.'
            Cache-Tag:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentPage'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type:
                          - string
                          - 'null'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          description: 'Invalid query or expired/context-mismatched cursor.'
        429:
          description: 'Rate limit exceeded.'
        503:
          description: 'Eligibility unavailable; retry later.'
  /api/v1/navigation:
    get:
      operationId: headlessV1Navigation
      summary: 'Supported v1 navigation'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: 'filter[type]'
          in: query
          schema:
            type: string
            maxLength: 100
        - name: 'filter[path]'
          in: query
          schema:
            type: string
            maxLength: 1024
      responses:
        200:
          description: 'Safe content representation.'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, no-cache; preview and bearer requests private, no-store.'
            Surrogate-Key:
              schema:
                type: string
              description: 'html-cache site-{id} purge key. Sent only when capell-api.expose_surrogate_key_header (CAPELL_API_EXPOSE_SURROGATE_KEY) is true.'
            Cache-Tag:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NavigationLink'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type:
                          - string
                          - 'null'
        304:
          $ref: '#/components/responses/NotModified'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/PageNotFound'
        422:
          description: 'Invalid query or expired/context-mismatched cursor.'
        429:
          description: 'Rate limit exceeded.'
        503:
          description: 'Eligibility unavailable; retry later.'
  /api/v1/media:
    get:
      operationId: headlessV1Media
      summary: 'Supported v1 media'
      security:
        - {}
        - PreviewBearer: []
      parameters:
        - $ref: '#/components/parameters/Url'
        - $ref: '#/components/parameters/Site'
        - $ref: '#/components/parameters/Language'
        - name: preview
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: 'Preview requires a personal Sanctum token with api:preview and api:preview:site:{site-id}.'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: 'filter[type]'
          in: query
          schema:
            type: string
            maxLength: 100
        - name: 'filter[path]'
          in: query
